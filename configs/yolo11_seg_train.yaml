data: ../dataset_yolo11_seg/dataset.yaml  # 使用工作区内正式训练、验证和测试数据配置
model: models/best.pt  # 从项目内唯一正式P2分割模型继续训练
imgsz: 960  # 保持新模型训练使用的输入尺寸
epochs: 100  # 单次继续训练轮数与新模型原始训练轮数一致
batch: 4  # 使用新模型训练时的批量大小
device: "0"  # 固定使用第一块英伟达显卡
project: runs/segment  # 将训练结果写入项目内分割实验目录
name: p2_yolo11s_seg_960_continue  # 使用P2模型专属实验名称
workers: 0  # Windows下使用主进程加载数据以提高兼容性
patience: 30  # 验证指标连续无提升时的早停等待轮数
cache: false  # 默认不建立额外数据缓存
amp: true  # 启用自动混合精度以降低显存占用
plots: true  # 保存训练曲线、混淆矩阵和验证可视化结果
deterministic: true  # 使用确定性训练设置以便复现实验
seed: 0  # 使用新模型训练时的随机种子
pretrained: true  # 从项目正式P2权重继续训练
resume: false  # 新建训练任务而不是恢复旧优化器状态
optimizer: auto  # 由Ultralytics根据训练规模选择优化器
cos_lr: true  # 使用余弦学习率调度
close_mosaic: 10  # 最后十轮关闭拼图增强
overlap_mask: true  # 训练时允许实例掩膜重叠
mask_ratio: 2  # 使用高分辨率掩膜保留细小损伤边缘
save_period: 10  # 每十轮保存阶段性权重
exist_ok: false  # 禁止覆盖已有同名实验目录
